<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hajun Portfolio</title>
  <style>
    /* --------------------------------------------------
       1. Reset & Color Variables
       -------------------------------------------------- */
    :root {
      --bg-color: #ffffff;
      --text-black: #000000;
      --accent-green: #81e69b;      /* 상단 버튼 및 밑줄 포인트 연초록색 */
      --card-bg: #d9d9d9;           /* 카드 이미지 플레이스홀더 회색 */
      --max-width: 900px;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-black);
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* --------------------------------------------------
       2. Header & Navigation
       -------------------------------------------------- */
    header {
      width: 100%;
      padding: 40px 0 20px;
      background-color: var(--bg-color);
    }

    .nav-container {
      max-width: var(--max-width);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    /* Left Logo */
    .logo-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-square {
      width: 32px;
      height: 32px;
      background-color: var(--accent-green);
      border-radius: 4px;
    }

    .logo-text {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* Right Nav Links (Oval Green Buttons) */
    nav {
      display: flex;
      gap: 12px;
    }

    nav a {
      background-color: var(--accent-green);
      color: var(--text-black);
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    nav a:hover {
      opacity: 0.85;
    }

    /* --------------------------------------------------
       3. Main Hero / Project Team Section
       -------------------------------------------------- */
    main {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* Section Header Title */
    .hero-header {
      text-align: center;
      margin-bottom: 50px;
    }

    .hero-icon {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .hero-title-project {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 6px;
      display: inline-block;
      position: relative;
      padding-bottom: 8px;
    }

    /* PROJECT 텍스트 하단 녹색 선 */
    .hero-title-project::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background-color: var(--accent-green);
      border-radius: 2px;
    }

    .hero-title-team {
      font-size: 2rem;
      font-weight: 700;
      margin-top: 8px;
    }

    /* 2x2 Grid Section */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 36px 30px;
    }

    .project-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-media {
      width: 100%;
      height: 240px;
      background-color: var(--card-bg);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 1.1rem;
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-title {
      margin-top: 14px;
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
      color: var(--text-black);
    }

    /* Responsive Design */
    @media (max-width: 640px) {
      .project-grid {
        grid-template-columns: 1fr;
      }
      .card-media {
        height: 200px;
      }
      .hero-title-project {
        font-size: 1.8rem;
        letter-spacing: 4px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <div class="logo-box">
        <div class="logo-square"></div>
        <span class="logo-text">Hajun</span>
      </div>
      <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main id="home">
    
    <!-- Title Area -->
    <section class="hero-header">
      <div class="hero-icon">🎮</div>
      <div>
        <span class="hero-title-project">PROJECT</span>
      </div>
      <h1 class="hero-title-team">Team</h1>
    </section>

    <!-- 2x2 Image Grid -->
    <section class="project-grid">
      <div class="project-card">
        <div class="card-media">
          <!-- <img src="images/game1.gif" alt="Game Text1"> -->
        </div>
        <div class="card-title">Game Text1</div>
      </div>

      <div class="project-card">
        <div class="card-media">
          <!-- <img src="images/game2.gif" alt="Game Text2"> -->
        </div>
        <div class="card-title">Game Text2</div>
      </div>

      <div class="project-card">
        <div class="card-media">
          <!-- <img src="images/game3.gif" alt="Game Text3"> -->
        </div>
        <div class="card-title">Game Text3</div>
      </div>

      <div class="project-card">
        <div class="card-media">
          <!-- <img src="images/game4.gif" alt="Game Text4"> -->
        </div>
        <div class="card-title">Game Text4</div>
      </div>
    </section>

  </main>

</body>
</html>
