<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hajun Portfolio</title>
  <style>
    /* ==================================================
       1. 디자인 변수 설정 (여기서 색상/크기 변경 가능)
       ================================================== */
    :root {
      --bg-color: #ffffff;          /* 전체 배경색 */
      --text-black: #000000;        /* 기본 글자색 (나중에 교체 가능) */
      --accent-green: #81e69b;      /* 상단 버튼 및 밑줄 포인트 연초록색 */
      --card-bg: #d9d9d9;           /* GIF/이미지 플레이스홀더 회색 */
      --max-width: 900px;           /* 전체 레이아웃 최대 너비 */
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 스타일 초기화 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-black);
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ==================================================
       2. 상단 네비게이션 헤더 (Header & Nav)
       ================================================== */
    header {
      width: 100%;
      padding: 40px 0 20px;
      background-color: var(--bg-color);
    }

    .nav-container {
      max-width: var(--max-width);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    /* 좌측 로고 (사각형 아이콘 + 이름) */
    .logo-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-square {
      width: 32px;
      height: 32px;
      background-color: var(--accent-green);
      border-radius: 4px;
    }

    .logo-text {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* 우측 카테고리 (연초록 타원형 버튼) */
    nav {
      display: flex;
      gap: 12px;
    }

    nav a {
      background-color: var(--accent-green);
      color: var(--text-black);
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    nav a:hover {
      opacity: 0.85; /* 마우스 올렸을 때 살짝 연해지는 효과 */
    }

    /* ==================================================
       3. 메인 컨텐츠 공통 스타일 (Main Layout)
       ================================================== */
    main {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 20px 20px 100px;
    }

    /* 섹션 제목 공통 스타일 (이모지, PROJECT, 하단 타이틀) */
    .section-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header-icon {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    /* PROJECT 텍스트 + 하단 연초록 밑줄 */
    .title-project {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 6px;
      display: inline-block;
      position: relative;
      padding-bottom: 8px;
    }

    .title-project::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background-color: var(--accent-green);
      border-radius: 2px;
    }

    /* 세번째 줄 서브 타이틀 (Team, Individual 등) */
    .title-sub {
      font-size: 2rem;
      font-weight: 700;
      margin-top: 8px;
    }

    /* ==================================================
       4. PROJECT Team 섹션 (2x2 격자)
       ================================================== */
    .team-section {
      margin-bottom: 100px; /* 아래 Individual 섹션과의 간격 */
    }

    .project-grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 2열 배치 */
      gap: 36px 30px;                       /* 카드 사이 상하/좌우 여백 */
    }

    /* 프로젝트 카드 공통 스타일 */
    .project-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* GIF/이미지 들어가는 회색 박스 */
    .card-media {
      width: 100%;
      height: 240px;
      background-color: var(--card-bg);
      border-radius: 24px;                  /* 모서리 둥글게 */
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 1.1rem;
    }

    /* 회색 박스 안에 <img> 태그 넣었을 때 딱 맞게 채우기 */
    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 게임 제목 텍스트 */
    .card-title {
      margin-top: 14px;
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
      color: var(--text-black);
    }

    /* ==================================================
       5. PROJECT Individual 섹션 (1개 중앙 배치)
       ================================================== */
    .individual-section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 카드 1개 너비 지정 및 중앙 정렬 */
    .single-card-wrapper {
      width: 100%;
      max-width: 420px;                     /* 카드 1개의 최대 너비 */
      margin: 0 auto;
    }

    /* ==================================================
       6. 모바일 반응형 설정
       ================================================== */
    @media (max-width: 640px) {
      .project-grid-2x2 {
        grid-template-columns: 1fr;           /* 모바일에서는 1열로 변경 */
      }
      .card-media {
        height: 200px;
      }
      .title-project {
        font-size: 1.8rem;
        letter-spacing: 4px;
      }
    }
  </style>
</head>
<body>

  <!-- ==================================================
       상단 네비게이션 헤더
       ================================================== -->
  <header>
    <div class="nav-container">
      <!-- 로고 (수정 시 text 변경 가능) -->
      <div class="logo-box">
        <div class="logo-square"></div>
        <span class="logo-text">Hajun</span>
      </div>

      <!-- 카테고리 링크 -->
      <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <!-- ==================================================
       메인 영역
       ================================================== -->
  <main id="home">
    
    <!-- 1. PROJECT Team 섹션 -->
    <section class="team-section">
      <div class="section-header">
        <div class="header-icon">🎮</div>
        <div><span class="title-project">PROJECT</span></div>
        <h1 class="title-sub">Team</h1>
      </div>

      <!-- 2x2 카드 격자 -->
      <div class="project-grid-2x2">
        <!-- 카드 1 -->
        <div class="project-card">
          <div class="card-media">
            <!-- GIF 이미지 삽입 방법: <img src="images/team1.gif" alt="Game Text1"> -->
          </div>
          <div class="card-title">Game Text1</div>
        </div>

        <!-- 카드 2 -->
        <div class="project-card">
          <div class="card-media">
            <!-- <img src="images/team2.gif" alt="Game Text2"> -->
          </div>
          <div class="card-title">Game Text2</div>
        </div>

        <!-- 카드 3 -->
        <div class="project-card">
          <div class="card-media">
            <!-- <img src="images/team3.gif" alt="Game Text3"> -->
          </div>
          <div class="card-title">Game Text3</div>
        </div>

        <!-- 카드 4 -->
        <div class="project-card">
          <div class="card-media">
            <!-- <img src="images/team4.gif" alt="Game Text4"> -->
          </div>
          <div class="card-title">Game Text4</div>
        </div>
      </div>
    </section>

    <!-- 2. PROJECT Individual 섹션 -->
    <section class="individual-section">
      <div class="section-header">
        <!-- 첫번째 줄 이모지 🕹️ -->
        <div class="header-icon">🕹️</div>
        <!-- 두번째 줄 PROJECT + 연초록 밑줄 -->
        <div><span class="title-project">PROJECT</span></div>
        <!-- 세번째 줄 Individual -->
        <h1 class="title-sub">Individual</h1>
      </div>

      <!-- 1개 중앙 배치 카드 -->
      <div class="single-card-wrapper">
        <div class="project-card">
          <div class="card-media">
            <!-- GIF 이미지 삽입 위치: <img src="images/indiv1.gif" alt="Game Text1"> -->
          </div>
          <div class="card-title">Game Text1</div>
        </div>
      </div>
    </section>

  </main>

</body>
</html>
